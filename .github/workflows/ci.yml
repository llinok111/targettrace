name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 18 is the declared floor in package.json "engines" — it must really run.
        node: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install
        run: npm ci
      - name: test
        run: npm test
      - name: docs match the measurements
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: |
          node scripts/gen-docs.cjs
          git diff --exit-code README.md docs/CORPUS.md
      - name: corpus measurement is reproducible
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: |
          node scripts/measure.cjs
          git diff --exit-code docs/MEASUREMENTS.json
      - name: demo builds
        run: node scripts/build-demo.cjs
